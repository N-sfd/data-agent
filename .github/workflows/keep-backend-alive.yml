name: Keep Render backend alive

on:
  schedule:
    # Every 10 minutes — Render's free tier can spin a service down after
    # ~15 minutes idle. This is a convenience warm-up, not a production SLA.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          echo "Pinging Render backend..."

          curl \
            --fail \
            --show-error \
            --silent \
            --retry 4 \
            --retry-delay 15 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 180 \
            https://data-agent-7jxa.onrender.com/health

          echo ""
          echo "Backend responded successfully."
